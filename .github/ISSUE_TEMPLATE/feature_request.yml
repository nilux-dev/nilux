name: Feature request
description: Something Nilux should be able to do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task you are stuck on, not the feature you have in mind. It is often solvable another way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working.
  - type: textarea
    id: workaround
    attributes:
      label: What you do today instead
      description: Knowing the workaround tells us how much this actually costs you.
